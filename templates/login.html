<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseworker sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container login-page">
    <main class="login-card card">
        <div class="brand-line"><span class="brand-mark">CM</span><span>Casework operations</span></div>
        <p class="eyebrow">RESTRICTED ACCESS</p>
        <h1>Caseworker sign in</h1>
        <p class="subtitle">Use your caseworker credentials to access resident case information.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" class="login-form">
            <label>Username<input name="username" autocomplete="username" required autofocus></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="primary" type="submit">Sign in</button>
        </form>
    </main>
</div>
</body>
</html>
